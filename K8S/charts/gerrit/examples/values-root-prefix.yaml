# Synthetic example: Gerrit served from the root of its host behind a
# plain Ingress, with the server ID, SSH host and heap set explicitly,
# an AWS NLB with external-dns for SSH, and jgit.config filled in. CI
# lints and renders the chart with every file in this directory, and
# tests/chart compares each rendered gerrit.config with a golden file.

gerrit:
  host: review.example.org
  urlPrefix: ""
  serverId: 00000000-0000-4000-8000-000000000000

ingress:
  enabled: true
  className: traefik

ssh:
  host: ssh.review.example.org
  service:
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: external
      service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
      service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
      service.beta.kubernetes.io/aws-load-balancer-target-group-attributes: preserve_client_ip.enabled=true
    externalDNS: true

sshd:
  threads: 16
  idleTimeout: 1h
  enableCompression: true

container:
  heapLimit: 3g
  javaOptions:
    - -XX:+UseG1GC

change:
  updateDelay: 5min
  mergeabilityComputationBehavior: API_REF_UPDATED_AND_CHANGE_REINDEX
  allowBlame: true

receive:
  enableSignedPush: false
  maxObjectSizeLimit: 100m
  timeout: 4min

index:
  type: lucene
  maxLimit: 10000
  onlineUpgrade: true

jgit:
  core:
    packedGitLimit: 1g
    packedGitOpenFiles: 4096
  receive:
    autogc: false
