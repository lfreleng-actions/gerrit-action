{{- $fullname := include "gerrit.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "gerrit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gerrit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- if .Values.ssh.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ssh
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
  {{- with .Values.ssh.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.ssh.service.type }}
  selector:
    {{- include "gerrit.selectorLabels" . | nindent 4 }}
  ports:
    - name: ssh
      port: 29418
      targetPort: ssh
{{- end }}
