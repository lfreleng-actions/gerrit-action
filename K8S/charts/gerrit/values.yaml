# Default values for the gerrit chart: one Gerrit primary per release.

nameOverride: ""
fullnameOverride: ""

image:
  # Placeholder until the published image exists; build the image from
  # this repository's Dockerfile and override repository and tag.
  repository: ghcr.io/lfreleng-actions/gerrit
  tag: ""                         # defaults to the chart appVersion
  digest: ""                      # sha256:...; takes precedence over tag
  pullPolicy: IfNotPresent

imagePullSecrets: []

gerrit:
  host: gerrit.example.org        # gerrit.canonicalWebUrl host
  urlPrefix: /r                   # served path prefix; "" for root
  # Scheme of gerrit.canonicalWebUrl, without the chart's Ingress
  webScheme: https
  # proxy-https behind a TLS-terminating proxy; http for direct access.
  # With ingress.enabled the chart derives both schemes instead.
  listenScheme: proxy-https
  instanceId: ""
  # Site identity, stamped on every change. Leave empty for a new site
  # and Gerrit generates one; the chart then keeps the site's own ID on
  # every start. When set it must match the site's ID, or site-init
  # fails before Gerrit starts. Copy it from the source site's
  # gerrit.config when importing.
  serverId: ""
  # Appended verbatim to gerrit.config, for settings with no typed
  # value below. A key here adds a second entry beside a typed one
  # rather than replacing it.
  extraConfig: ""

# The sections below render into etc/gerrit.config, which site-init
# replaces from the chart at every start. Each key is the Gerrit key of
# the same name (config-gerrit.html); null or "" leaves it out so
# Gerrit's own default applies, a list repeats the key, and a map under
# a section renders a subsection such as [cache "diff"]. Secrets never
# go here: render-config writes them to etc/secure.config.

# httpd.listenUrl is derived from gerrit.listenScheme and urlPrefix
httpd:
  maxQueued: null
  requestLog: null

# sshd.advertisedAddress is derived: ssh.host and the SSH port; see ssh
sshd:
  listenAddress: "*:29418"
  threads: null
  idleTimeout: null
  enableCompression: null

# auth.registerEmailPrivateKey comes from secrets.secureConfig
auth:
  # Smoke default only; never use it in production
  type: DEVELOPMENT_BECOME_ANY_ACCOUNT
  gitBasicAuthPolicy: null
  contributorAgreements: null
  editableAccountFields: []
  cookieSecure: null

# sendemail.smtpPass comes from secrets.secureConfig
sendemail:
  # Gerrit's default is true, with a relay on localhost the pod lacks
  enable: false
  smtpServer: null
  smtpServerPort: null
  smtpEncryption: null
  from: null
  smtpUser: null

# The chart always sets the JVM options the image needs, and a heap of
# 70% of resources.limits.memory unless heapLimit is set.
container:
  user: gerrit
  heapLimit: null
  javaOptions: []                 # extra options, one per entry

# cache.directory is always "cache" on the site volume. Each map
# renders one [cache "<name>"] subsection.
cache:
  # diskLimit of each persistent cache, rendered into its subsection
  # unless that sets diskLimit itself; null or "" drops one. Gerrit
  # trims a cache over its limit once a day, at 1 AM server time.
  limits:
    comment_context: 128m
    conflicts: 128m
    diff_intraline: 512m
    diff_summary: 1g
    gerrit_file_diff: 1g
    git_file_diff: 1g
    git_modified_files: 512m
    modified_files: 1g

change:
  updateDelay: null
  mergeabilityComputationBehavior: null
  enableRobotComments: null
  allowBlame: null

receive:
  enableSignedPush: null
  maxObjectSizeLimit: null
  timeout: null

download:
  scheme: []
  command: []
  archive: []

index:
  type: null
  maxLimit: null
  onlineUpgrade: null

# Gerrit's built-in gc scheduler, weekly and off-peak by default
gc:
  startTime: Sun 03:00
  interval: 1 week
  aggressive: null

plugins:
  allowRemoteAdmin: false

# Free-form sections; for trackingid each map is one subsection, for
# example {jira: {match: "...", system: JIRA, link: "..."}}
user: {}
trackingid: {}
accounts: {}
suggest: {}

# etc/jgit.config and etc/notedb.config, rendered the same way: each
# top-level key is a section, for example {core: {packedGitLimit: 1g}}
jgit:
  # Gerrit packs through gc above, never after each push
  receive:
    autogc: false
notedb: {}

# Plugins and libraries copied into the site from the image catalogue
# at every start. Each name is a jar basename without ".jar".
pluginCatalogue:
  path: /var/gerrit-catalogue
  plugins: []
  libs: []

persistence:
  storageClassName: ""
  size: 20Gi
  # Root init container that chowns the site volume, for provisioners
  # that ignore fsGroup (kind's local-path). It runs as root, so the
  # namespace cannot enforce the restricted Pod Security level.
  volumePermissions:
    enabled: false

resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    memory: 4Gi

# The chart generates each Secret once and reuses its values on upgrade
# through lookup. A GitOps tool that renders offline, such as Argo CD,
# sees no existing values and would replace them at every sync: create
# the Secrets outside the chart and name them here instead.
secrets:
  admin:
    existingSecret: ""            # keys: username, password
  secureConfig:
    # keys: registerEmailPrivateKey, and smtpPass when the relay
    # needs a password
    existingSecret: ""

# HTTP access through the cluster's Ingress controller. TLS ends at
# the controller, and Gerrit listens on proxy-https:// behind it, or
# proxy-http:// with tls.enabled false.
ingress:
  enabled: false
  className: ""                   # e.g. traefik or nginx
  annotations: {}                 # added to the chart's own; win on a clash
  tls:
    enabled: true
    secretName: ""                # defaults to <fullname>-tls
    # cert-manager ClusterIssuer that issues the Secret; "" to create
    # the Secret yourself
    issuer: letsencrypt-prod
  redirectRootToPrefix: true      # "/" -> "<urlPrefix>/"
  securityHeaders:
    # CSP, HSTS, Referrer-Policy, Permissions-Policy and
    # X-Content-Type-Options; rendered with traefik.enabled only
    enabled: true
    contentSecurityPolicy: ""     # "" for the chart's default policy
  traefik:
    # Render a Traefik IngressRoute and Middlewares instead of a plain
    # Ingress; needs Traefik's CRDs, and cert-manager's with tls.issuer
    enabled: false
    entryPoints: []               # [] for Traefik's default entry points

ssh:
  # Host clients use for SSH, without a port; defaults to gerrit.host.
  # sshd.advertisedAddress is this host followed by the SSH port.
  host: ""
  # Port clients use for SSH, for when something in front publishes
  # 29418 on another port; null for service.nodePort with a NodePort
  # Service, else 29418
  port: null
  service:
    enabled: true
    type: LoadBalancer
    # Fixed node port with type NodePort, and the advertised port unless
    # ssh.port is set; a NodePort Service needs this or ssh.port
    nodePort: null
    # For an AWS NLB through the AWS Load Balancer Controller:
    #   service.beta.kubernetes.io/aws-load-balancer-type: external
    #   service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    #   service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    annotations: {}
    # Local keeps the client address, so sshd_log records it; applies to
    # LoadBalancer and NodePort Services only
    externalTrafficPolicy: Local
    # Add external-dns.alpha.kubernetes.io/hostname: <ssh.host>
    externalDNS: false

networkPolicy:
  enabled: true
  # Namespaces that may reach port 8080, as a label selector; {} admits
  # any source. For example:
  #   matchLabels:
  #     kubernetes.io/metadata.name: traefik
  ingressNamespaceSelector: {}

podAnnotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
