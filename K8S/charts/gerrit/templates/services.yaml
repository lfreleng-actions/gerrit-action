{{- $fullname := include "gerrit.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "gerrit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-http
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "gerrit.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
{{- with .Values.ssh.service }}
{{- if .enabled }}
{{- $sshHost := include "gerrit.sshHost" $ }}
{{- $annotations := deepCopy (default dict .annotations) }}
{{- if .externalDNS }}
{{- if and $.Values.ingress.enabled (eq $sshHost (include "gerrit.httpHost" $)) }}
{{- fail "ssh.service.externalDNS with ingress.enabled needs an ssh.host other than gerrit.host: the SSH Service and the Ingress would claim the same DNS name" }}
{{- end }}
{{- $_ := set $annotations "external-dns.alpha.kubernetes.io/hostname" $sshHost }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-ssh
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "gerrit.labels" $ | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .type }}
  {{- if and .externalTrafficPolicy (has .type (list "LoadBalancer" "NodePort")) }}
  externalTrafficPolicy: {{ .externalTrafficPolicy }}
  {{- end }}
  selector:
    {{- include "gerrit.selectorLabels" $ | nindent 4 }}
  ports:
    - name: ssh
      port: 29418
      targetPort: ssh
      {{- if and (eq .type "NodePort") .nodePort }}
      nodePort: {{ int .nodePort }}
      {{- end }}
{{- end }}
{{- end }}
