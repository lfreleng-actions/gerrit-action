{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "gerrit.fullname" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gerrit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-allow
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gerrit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "gerrit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 29418
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
    {{- with .Values.sendemail }}
    {{- if and .smtpServer (ne (toString .enable) "false") }}
    {{- /* Gerrit's default port is 465 with SSL and 25 otherwise */}}
    {{- $default := ternary 465 25 (eq (lower (toString .smtpEncryption)) "ssl") }}
    - ports:
        - protocol: TCP
          port: {{ int (.smtpServerPort | default $default) }}
    {{- end }}
    {{- end }}
{{- end }}
